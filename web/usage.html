<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maclawd — 用量统计</title>
<style>
  :root{
    color-scheme:light;
    --bg:#f4f1ea; --ink:#1e1e2e; --muted:#626271; --accent:#c67a62; --body:#DE886D;
    --card:#fbfaf7; --line:rgba(30,30,46,.11);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;padding:32px 24px 72px;background:var(--bg);color:var(--ink);}
  main{width:min(1080px,100%);margin:0 auto;}
  a{color:var(--accent);}
  .nav{display:flex;gap:16px;align-items:center;margin-bottom:24px;font-size:13px;}
  .nav b{font-size:15px;letter-spacing:-.01em;}
  .nav a{text-decoration:none;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card);}
  .nav a[aria-current]{background:var(--ink);color:#fff;border-color:var(--ink);}
  .card{border:1px solid var(--line);border-radius:24px;background:var(--card);padding:22px 24px;margin-bottom:16px;}
  .hero{display:flex;gap:24px;align-items:center;}
  .stage{width:112px;height:112px;flex:0 0 112px;border-radius:20px;
    background:linear-gradient(rgba(30,30,46,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(30,30,46,.035) 1px,transparent 1px),#fff;
    background-size:16px 16px;display:grid;place-items:center;overflow:hidden;}
  .stage object,.stage img{width:100%;height:100%;image-rendering:pixelated;}
  .heroText{flex:1;min-width:0;}
  .stateName{margin:0;font-size:19px;}
  .stateStory{margin:4px 0 0;color:var(--muted);font-size:13px;line-height:1.5;}
  .rate{margin-top:12px;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);}
  .bar{height:7px;flex:1;max-width:220px;border-radius:99px;background:rgba(30,30,46,.08);overflow:hidden;}
  .bar i{display:block;height:100%;background:var(--body);border-radius:99px;transition:width .5s ease;}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px;}
  .chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);
    font-size:12px;font-weight:650;cursor:pointer;}
  .chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink);}
  select{padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);
    font-size:12px;color:var(--ink);max-width:190px;}
  .headline{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-end;}
  .big{font-size:clamp(34px,5vw,52px);line-height:1;letter-spacing:-.03em;font-weight:700;}
  .big small{font-size:14px;font-weight:600;color:var(--muted);margin-left:8px;letter-spacing:0;}
  .kv{font-size:12px;color:var(--muted);line-height:1.7;}
  .kv b{color:var(--ink);font-size:15px;display:block;}
  .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:14px;margin-top:18px;
    padding-top:18px;border-top:1px solid var(--line);}
  .spark{font:11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px;color:var(--accent);
    white-space:pre;overflow-x:auto;}
  .axis{font-size:10px;color:var(--muted);display:flex;justify-content:space-between;max-width:340px;margin-top:4px;}
  .bars{display:flex;align-items:flex-end;gap:2px;height:80px;margin-top:6px;}
  .bars i{flex:1;min-width:2px;background:var(--body);border-radius:2px 2px 0 0;opacity:.85;}
  .bars i:hover{opacity:1;outline:1px solid var(--accent);}
  .heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);gap:3px;margin-top:8px;overflow-x:auto;padding-bottom:4px;}
  .heat i{width:11px;height:11px;border-radius:2px;background:rgba(30,30,46,.06);}
  h2{font-size:15px;margin:0 0 12px;}
  h2 span{font-weight:500;color:var(--muted);font-size:12px;margin-left:6px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  td,th{padding:7px 6px;text-align:right;border-bottom:1px solid rgba(30,30,46,.06);}
  th{font-size:11px;color:var(--muted);font-weight:600;}
  td:first-child,th:first-child{text-align:left;}
  tr.row{cursor:pointer;}
  tr.row:hover td{background:rgba(198,122,98,.06);}
  tr.detail td{background:rgba(30,30,46,.025);font-size:11.5px;color:var(--muted);}
  .track{height:5px;border-radius:99px;background:rgba(30,30,46,.07);overflow:hidden;min-width:56px;}
  .track i{display:block;height:100%;background:var(--body);}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;}
  .open{display:inline-flex;gap:5px;}
  .open button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:3px 7px;
    font-size:10.5px;cursor:pointer;color:var(--muted);}
  .open button:hover{border-color:var(--accent);color:var(--accent);}
  .wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px;}
  .note{font-size:12px;color:var(--muted);line-height:1.6;}
  .warn{color:#a55f4c;}
  details summary{cursor:pointer;font-size:13px;font-weight:600;}
  @media(max-width:640px){.hero{flex-direction:column;align-items:flex-start;}}
</style>
</head>
<body>
<main>
  <div class="nav">
    <b>Maclawd</b>
    <a href="/">宠物管理</a>
    <a href="/usage" aria-current="page">用量统计</a>
    <span style="flex:1"></span>
    <button class="chip" id="updatePrices">更新价格表</button>
    <button class="chip" id="rescan">重新扫描</button>
  </div>

  <div class="card hero">
    <div class="stage"><object id="heroSvg" type="image/svg+xml" data="/src/animations/calm-calibration.svg"></object></div>
    <div class="heroText">
      <p class="stateName" id="stateName">安静地看着你</p>
      <p class="stateStory" id="stateStory">不带道具，安静呼吸、观察和眨眼</p>
      <div class="rate">
        <span class="bar"><i id="rateBar" style="width:0%"></i></span>
        <span id="rateText">0/min</span>
      </div>
    </div>
  </div>

  <div class="toolbar" id="ranges"></div>
  <div class="toolbar">
    <select id="fSource"></select>
    <select id="fModel"></select>
    <select id="fProject"></select>
    <button class="chip" id="clearFilters">清除筛选</button>
  </div>

  <div class="card">
    <div class="headline">
      <div>
        <div class="big"><span id="mainNum">–</span><small id="mainUnit">计费 tokens</small></div>
        <div class="kv" id="compare"></div>
      </div>
      <div class="kv"><b id="costNum">–</b>估算成本</div>
      <div class="kv"><b id="coverage">–</b>计价覆盖率</div>
      <div class="kv"><b id="hit">–</b>缓存命中率</div>
      <div class="kv"><b id="active">–</b>活跃时长</div>
    </div>
    <div class="metrics" id="fields"></div>
    <p class="note warn" id="coverageNote" hidden></p>
  </div>

  <div class="grid2">
    <div class="card">
      <h2>作息分布 <span>按小时，全部来源</span></h2>
      <div class="spark" id="hours"></div>
      <div class="axis"><span>0</span><span>6</span><span>12</span><span>18</span><span>23</span></div>
      <p class="note" id="hoursNote" hidden>筛选状态下作息分布不可用——预聚合的小时数据是跨来源汇总的，按筛选条件拆不出来。</p>
    </div>
    <div class="card">
      <h2>每日趋势 <span id="dailyMeta"></span></h2>
      <div class="bars" id="daily"></div>
    </div>
  </div>

  <div class="card">
    <h2>活跃热力 <span>纵轴周一至周日</span></h2>
    <div class="heat" id="heat"></div>
  </div>

  <div class="grid2">
    <div class="card">
      <h2>按工具</h2>
      <table><thead><tr><th>工具</th><th>计费</th><th>占比</th></tr></thead><tbody id="tBySource"></tbody></table>
    </div>
    <div class="card">
      <h2>按模型 <span>点击展开明细</span></h2>
      <table><thead><tr><th>模型</th><th>计费</th><th>占比</th></tr></thead><tbody id="tByModel"></tbody></table>
    </div>
  </div>

  <div class="card">
    <h2>项目足迹 <span>点击项目名筛选，按钮直接打开</span></h2>
    <table><thead><tr><th>项目</th><th>计费</th><th>吞吐</th><th>占比</th><th></th></tr></thead>
      <tbody id="tByProject"></tbody></table>
    <p class="note" id="projectNote" hidden></p>
  </div>

  <div class="card">
    <h2>回顾</h2>
    <div class="wrap" id="wrapped"></div>
  </div>

  <p class="note" id="footer"></p>
</main>

<script>
const RANGES = [
  ['today','今天'],['yesterday','昨天'],['week','本周'],
  ['last_week','上周'],['month','本月'],['year','今年'],['all','全部'],
];
const state = { range:'today', source:'', model:'', project:'', settings:{}, data:null };

const fmt = (n) => {
  n = Number(n)||0;
  if (n >= 1e9) return (n/1e9).toFixed(2)+'B';
  if (n >= 1e6) return (n/1e6).toFixed(2)+'M';
  if (n >= 1e3) return (n/1e3).toFixed(1)+'K';
  return String(Math.round(n));
};
const pct = (x) => (x*100).toFixed(x >= 0.995 || x === 0 ? 0 : 1)+'%';
const dur = (s) => {
  s = Math.round(s||0);
  const h = Math.floor(s/3600), m = Math.round((s%3600)/60);
  return h > 0 ? `${h}h ${m}m` : `${m}m`;
};
const el = (id) => document.getElementById(id);

function renderRanges(){
  el('ranges').innerHTML = RANGES.map(([id,label]) =>
    `<button class="chip" data-range="${id}" aria-pressed="${state.range===id}">${label}</button>`).join('');
  el('ranges').querySelectorAll('button').forEach(b =>
    b.onclick = () => { state.range = b.dataset.range; load(); });
}

function fillSelect(node, values, current, allLabel, labels){
  node.innerHTML = `<option value="">${allLabel}</option>` + values.map(v =>
    `<option value="${esc(v)}"${v===current?' selected':''}>${esc(labels?.[v] ?? v)}</option>`).join('');
}
const esc = (s) => String(s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/** 表格通用渲染：名字 + 计费 + 占比条。 */
function rows(tbody, entries, total, { onClick, extra } = {}){
  tbody.innerHTML = entries.map(([key, bill, tp]) => {
    const share = total > 0 ? bill/total : 0;
    return `<tr class="row" data-key="${esc(key)}">
      <td>${esc(key)}</td>
      <td>${fmt(bill)}</td>
      ${tp !== undefined ? `<td>${fmt(tp)}</td>` : ''}
      <td><span class="track"><i style="width:${(share*100).toFixed(1)}%"></i></span></td>
      ${extra ? `<td>${extra(key)}</td>` : ''}
    </tr>`;
  }).join('') || '<tr><td colspan="5" style="color:var(--muted)">暂无数据</td></tr>';
  if (onClick) tbody.querySelectorAll('tr.row').forEach(tr =>
    tr.querySelector('td').onclick = () => onClick(tr.dataset.key));
}

const bill = (b) => (b.input||0)+(b.write5m||0)+(b.write1h||0)+(b.output||0);
const tput = (b) => bill(b)+(b.cacheRead||0);

function render(){
  const d = state.data;
  if (!d || d.empty){
    el('mainNum').textContent = '–';
    el('footer').textContent = state.data?.stale
      ? '聚合数据是旧版本结构，需要重新扫描才能读取。点右上角「重新扫描」。'
      : '还没有用量记录。点右上角「重新扫描」。';
    return;
  }
  const s = d.summary;
  const showCost = d.settings.showCost;
  const primary = d.settings.primaryMetric === 'throughput' ? s.throughput : s.billable;

  el('mainNum').textContent = fmt(primary);
  el('mainUnit').textContent = d.settings.primaryMetric === 'throughput' ? '吞吐 tokens' : '计费 tokens';
  el('mainNum').title = `计费 ${fmt(s.billable)} · 吞吐 ${fmt(s.throughput)}（差额即缓存读 ${fmt(s.cacheRead)}）`;

  el('costNum').textContent = showCost && s.cost !== null ? '$'+s.cost.toFixed(2) : '—';
  el('coverage').textContent = pct(d.coverage);
  el('hit').textContent = pct(s.hitRate);
  el('active').textContent = dur(d.sessions.activeSeconds);

  // 「比平时」用个人 14 天中位数，不用固定阈值——固定阈值会让重度用户永远看到红色。
  if (d.baseline && state.range === 'today' && s.throughput > 0){
    const delta = (s.throughput - d.baseline) / d.baseline;
    el('compare').textContent = `比平时${delta>=0?'多':'少'} ${pct(Math.abs(delta))}（14 天中位数 ${fmt(d.baseline)}）`;
  } else el('compare').textContent = `${d.sessions.sessions} 会话 · ${fmt(d.sessions.messageCount)} 消息`;

  el('fields').innerHTML = [
    ['输入（非缓存）', s.input], ['输出', s.output],
    ['缓存读', s.cacheRead], ['缓存写', s.cacheWrite],
    ['推理', s.reasoning],
  ].map(([k,v]) => `<div class="kv"><b>${fmt(v)}</b>${k}</div>`).join('');

  if (s.unpricedModels?.length){
    el('coverageNote').hidden = false;
    const stale = !d.pricing?.fetchedAt;
    el('coverageNote').textContent = stale
      ? `价格表还没拉取过，${fmt(s.unpricedTokens)} tokens 未计价。点「更新价格表」——实测能把覆盖率从 10% 提到 97.8%。`
      : `${fmt(s.unpricedTokens)} tokens 未计价，缺：${s.unpricedModels.slice(0,6).join('、')}。`
        + '未知模型不猜价格；这些多是厂商自有的新模型，补 usage/pricing.overrides.json 即可计入。';
  } else el('coverageNote').hidden = true;

  // 作息
  el('hoursNote').hidden = s.hoursAvailable;
  if (s.hoursAvailable){
    const blocks = '▁▂▃▄▅▆▇█', max = Math.max(...s.hours, 1);
    el('hours').textContent = s.hours.map(v =>
      v===0 ? ' ' : blocks[Math.min(7, Math.floor(v/max*7.999))]).join('');
  } else el('hours').textContent = '';

  // 每日趋势
  const daily = s.daily.slice(-60);
  const dmax = Math.max(...daily.map(x => x.throughput), 1);
  el('dailyMeta').textContent = `最近 ${daily.length} 天`;
  el('daily').innerHTML = daily.map(x =>
    `<i style="height:${Math.max(2, x.throughput/dmax*100)}%" title="${x.day} · 计费 ${fmt(x.billable)} · 吞吐 ${fmt(x.throughput)}"></i>`).join('');

  // 周热力：纵轴周一至周日，列为周
  const byDay = new Map(s.daily.map(x => [x.day, x.throughput]));
  const hmax = Math.max(...byDay.values(), 1);
  const cells = [];
  if (s.daily.length){
    const first = new Date(s.daily[0].day+'T00:00:00');
    const last = new Date(s.daily.at(-1).day+'T00:00:00');
    const start = new Date(first); start.setDate(start.getDate() - ((start.getDay()+6)%7));
    for (let c = new Date(start); c <= last; c.setDate(c.getDate()+1)){
      const key = `${c.getFullYear()}-${String(c.getMonth()+1).padStart(2,'0')}-${String(c.getDate()).padStart(2,'0')}`;
      const v = byDay.get(key) || 0;
      const a = v === 0 ? 0 : 0.18 + 0.82*Math.pow(v/hmax, .45);
      cells.push(`<i style="background:${v?`rgba(222,136,109,${a.toFixed(2)})`:'rgba(30,30,46,.06)'}" title="${key} · ${fmt(v)}"></i>`);
    }
  }
  el('heat').innerHTML = cells.join('');

  // 三个维度
  const sortEntries = (map) => Object.entries(map)
    .map(([k,b]) => [k, bill(b), tput(b)]).sort((a,b) => b[1]-a[1]);

  rows(el('tBySource'), sortEntries(s.bySource).map(([k,b]) => [d.labels[k] ?? k, b]), s.billable, {
    onClick: (label) => {
      const id = Object.keys(d.labels).find(k => d.labels[k] === label) ?? label;
      state.source = state.source === id ? '' : id; load();
    },
  });

  const models = sortEntries(s.byModel);
  el('tByModel').innerHTML = models.map(([k, b]) => {
    const bucket = s.byModel[k], share = s.billable>0 ? b/s.billable : 0;
    return `<tr class="row" data-model="${esc(k)}">
        <td>${esc(k)}</td><td>${fmt(b)}</td>
        <td><span class="track"><i style="width:${(share*100).toFixed(1)}%"></i></span></td>
      </tr>
      <tr class="detail" hidden><td colspan="3">
        输入 ${fmt(bucket.input)} · 输出 ${fmt(bucket.output)} ·
        缓存读 ${fmt(bucket.cacheRead)} · 缓存写 ${fmt((bucket.write5m||0)+(bucket.write1h||0))} ·
        推理 ${fmt(bucket.reasoning)} · 吞吐 ${fmt(tput(bucket))}
      </td></tr>`;
  }).join('') || '<tr><td colspan="3" style="color:var(--muted)">暂无数据</td></tr>';
  el('tByModel').querySelectorAll('tr.row').forEach(tr => {
    tr.onclick = (e) => {
      if (e.metaKey || e.ctrlKey){ state.model = state.model===tr.dataset.model?'':tr.dataset.model; load(); return; }
      const next = tr.nextElementSibling;
      if (next) next.hidden = !next.hidden;
    };
  });

  // 隐藏与置顶：设置里存的是项目名列表，这里真正生效
  const hidden = new Set(d.settings.hiddenProjects ?? []);
  const pinned = d.settings.pinnedProjects ?? [];
  const projects = sortEntries(s.byProject)
    .filter(([key]) => !hidden.has(key))
    .sort((a, b) => {
      const pa = pinned.indexOf(a[0]), pb = pinned.indexOf(b[0]);
      if (pa !== pb) return (pa < 0 ? 1e9 : pa) - (pb < 0 ? 1e9 : pb);
      return b[1] - a[1];
    });
  if (hidden.size > 0) {
    el('projectNote').hidden = false;
    el('projectNote').textContent = `已隐藏 ${hidden.size} 个项目（在设置里管理）`;
  } else el('projectNote').hidden = true;

  rows(el('tByProject'), projects, s.billable, {
    onClick: (key) => { state.project = state.project===key?'':key; load(); },
    extra: (key) => {
      const path = d.projectPaths[key];
      if (!path) return '<span class="note">路径未知</span>';
      return `<span class="open">
        <button data-open="finder" data-path="${esc(path)}">Finder</button>
        <button data-open="vscode" data-path="${esc(path)}">VS Code</button>
        <button data-open="terminal" data-path="${esc(path)}">终端</button>
        <button data-pin="${esc(key)}">${pinned.includes(key) ? '取消置顶' : '置顶'}</button>
        <button data-hide="${esc(key)}">隐藏</button></span>`;
    },
  });
  const patchSettings = async (patch) => {
    await fetch('/api/settings', { method:'POST', body: JSON.stringify(patch) });
    await load();
  };
  el('tByProject').querySelectorAll('button[data-pin]').forEach(b => {
    b.onclick = (e) => {
      e.stopPropagation();
      const name = b.dataset.pin;
      const next = pinned.includes(name) ? pinned.filter(x => x !== name) : [...pinned, name];
      patchSettings({ pinnedProjects: next });
    };
  });
  el('tByProject').querySelectorAll('button[data-hide]').forEach(b => {
    b.onclick = (e) => {
      e.stopPropagation();
      patchSettings({ hiddenProjects: [...hidden, b.dataset.hide] });
    };
  });
  el('tByProject').querySelectorAll('button[data-open]').forEach(b => {
    b.onclick = async (e) => {
      e.stopPropagation();
      b.textContent = '…';
      try{
        const r = await fetch('/api/open', { method:'POST',
          body: JSON.stringify({ action:b.dataset.open, path:b.dataset.path }) });
        b.textContent = r.ok ? '✓' : '失败';
      } catch { b.textContent = '失败'; }
      setTimeout(() => { b.textContent = { finder:'Finder', vscode:'VS Code', terminal:'终端' }[b.dataset.open]; }, 1200);
    };
  });

  const w = d.wrapped;
  el('wrapped').innerHTML = [
    ['活跃天数', `${w.activeDays} 天`],
    ['连续活跃', `${w.streak} 天`],
    ['高峰时段', `${String(w.peakHour).padStart(2,'0')}:00`],
    ['本命模型', w.topModel ?? '—'],
    ['主战场', w.topProject ?? '—'],
    ['起始', w.firstDay ?? '—'],
  ].map(([k,v]) => `<div class="kv"><b>${esc(v)}</b>${k}</div>`).join('');

  fillSelect(el('fSource'), d.dimensions.sources, state.source, '全部工具', d.labels);
  fillSelect(el('fModel'), d.dimensions.models, state.model, '全部模型');
  fillSelect(el('fProject'), d.dimensions.projects, state.project, '全部项目');

  const pm = d.pricing ?? {};
  el('footer').textContent = `${s.days.length} 天数据 · 价格表 `
    + (pm.fetchedAt ? `${pm.models} 个模型，更新于 ${pm.fetchedAt.slice(0,10)}` : '未拉取')
    + ` · 主数字口径「`
    + (d.settings.primaryMetric === 'throughput' ? '吞吐' : '计费')
    + `」，两者差额即缓存读。成本${showCost?'':'（已在设置中隐藏）'}仅为按 API 单价的估算，与订阅费无关。`;
}

async function load(){
  const q = new URLSearchParams({ range: state.range });
  if (state.source) q.set('source', state.source);
  if (state.model) q.set('model', state.model);
  if (state.project) q.set('project', state.project);
  state.data = await (await fetch('/api/summary?'+q)).json();
  if (state.data.settings) state.settings = state.data.settings;
  renderRanges();
  render();
}

async function live(){
  try{
    const r = await (await fetch('/api/live')).json();
    el('rateBar').style.width = (r.intensity*100).toFixed(0)+'%';
    el('rateText').textContent = fmt(r.tokensPerMin)+'/min';
    // 角色台头随速率切换状态：有 token 在流动就是在干活。
    const working = r.tokensPerMin > 0;
    el('heroSvg').data = working ? '/src/animations/token-knitting.svg' : '/src/animations/calm-calibration.svg';
    el('stateName').textContent = working ? '正在整理工作牌' : '安静地看着你';
    el('stateStory').textContent = working
      ? '在身前交替整理两块重叠工作牌'
      : '不带道具，安静呼吸、观察和眨眼';
  } catch {}
}

el('fSource').onchange = (e) => { state.source = e.target.value; load(); };
el('fModel').onchange = (e) => { state.model = e.target.value; load(); };
el('fProject').onchange = (e) => { state.project = e.target.value; load(); };
el('clearFilters').onclick = () => { state.source = state.model = state.project = ''; load(); };
el('updatePrices').onclick = async () => {
  const b = el('updatePrices');
  b.textContent = '拉取中…';
  try{
    const r = await (await fetch('/api/update-prices', { method:'POST' })).json();
    b.textContent = r.error ? '失败' : `${r.count} 个模型`;
    await load();
  } catch { b.textContent = '失败'; }
  setTimeout(() => { b.textContent = '更新价格表'; }, 2000);
};

el('rescan').onclick = async () => {
  el('rescan').textContent = '扫描中…';
  try{
    const r = await (await fetch('/api/scan', { method:'POST' })).json();
    el('rescan').textContent = r.error ? '失败' : `${r.elapsedMs}ms`;
    await load();
  } catch { el('rescan').textContent = '失败'; }
  setTimeout(() => { el('rescan').textContent = '重新扫描'; }, 1600);
};

load();
live();
setInterval(live, 3000);
</script>
</body>
</html>
