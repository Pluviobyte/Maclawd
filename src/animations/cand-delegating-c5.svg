<?xml-stylesheet type="text/css" href="maclawd-actions.css"?>
<svg xmlns="http://www.w3.org/2000/svg" class="state-delegating-c5" viewBox="-15 -25 45 45" width="500" height="500" shape-rendering="crispEdges">
  <title>Maclawd Round Trip</title><desc>一个循环是一件完整的事：交出包裹（两拍，快）→ **空手等着（最长的一拍，占三成，主角沉下来、点脚、盯着信使走的方向）** → 信使带着东西回来 → 接过、点一下头。包裹出去是黄的、回来是青的（关键帧直接换 fill），所以「回来的不是同一件东西，是结果」这件事不用讲。现在的实现是均匀接力，从头到尾一个节奏；这个候选把 SubagentStart 到SubagentStop 的整个回合画进了一个循环里。【一个 vs 多个】变的是**等待时间**：一个子代理时那段空手真的空着，主角在点脚；两个及以上时 .helper-b（更高那条道上的第二个信使，周期 4200 与 5600 错开）在空档里进出，主角几乎没有闲着的时候。「派得越多越没空」——这是六个里唯一一个变体改的是节奏而不是元素数量的。【表达 N】按信使数扩，每个用一个互质周期，回合自然交错。【不像埋头干】最长的一拍是**什么都没干**，working 里不可能有这一拍。</desc>
  <g class="helper-a motion"><rect x="17" y="9" width="6" height="4" fill="#F1A186"/><rect x="15" y="10" width="2" height="2" fill="#F1A186"/><rect x="23" y="10" width="2" height="2" fill="#F1A186"/><rect x="18" y="13" width="1" height="2" fill="#F1A186"/><rect x="21" y="13" width="1" height="2" fill="#F1A186"/><rect x="18" y="10" width="1" height="2" fill="#000000"/><rect x="21" y="10" width="1" height="2" fill="#000000"/></g><g class="helper-b motion"><rect x="21" y="4" width="5" height="3" fill="#EAB078"/><rect x="22" y="7" width="1" height="2" fill="#EAB078"/><rect x="24" y="7" width="1" height="2" fill="#EAB078"/><rect x="22" y="5" width="1" height="1" fill="#000000"/><rect x="24" y="5" width="1" height="1" fill="#000000"/><rect x="21" y="1" width="3" height="3" fill="#F6C85F"/><rect x="21" y="2" width="3" height="1" fill="#FFE59A"/></g><g class="actor motion"><g fill="#DE886D"><g class="leg-a motion"><rect id="outer-left-leg" x="3" y="13" width="1" height="2"/></g><g class="leg-b motion"><rect id="inner-left-leg" x="5" y="13" width="1" height="2"/></g><g class="leg-c motion"><rect id="inner-right-leg" x="9" y="13" width="1" height="2"/></g><g class="leg-d motion"><rect id="outer-right-leg" x="11" y="13" width="1" height="2"/></g><rect id="torso" x="2" y="6" width="11" height="7"/><g class="left-claw motion"><rect id="left-arm" x="0" y="9" width="2" height="2"/></g><g class="right-claw motion"><rect id="right-arm" x="13" y="9" width="2" height="2"/></g></g><g class="eyes motion" fill="#000000"><g class="blink motion"><rect id="left-eye" x="4" y="8" width="1" height="2"/><rect id="right-eye" x="10" y="8" width="1" height="2"/></g></g></g><g class="parcel motion" fill="#F6C85F"><rect x="13" y="10" width="4" height="4"/><rect x="13" y="11" width="4" height="1" fill="#8C7A5E"/></g>
</svg>
