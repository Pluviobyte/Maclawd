<?xml-stylesheet type="text/css" href="maclawd-actions.css"?>
<svg xmlns="http://www.w3.org/2000/svg" class="state-error-c6" viewBox="-15 -25 45 45" width="500" height="500" shape-rendering="crispEdges">
  <title>Maclawd Wrong Way Up</title><desc>被地上翘起的一块板绊翻，横躺着。蹬两下没翻回来，就不蹬了。翻不过身的乌龟——困住了但完全没死，这个基调最直白的一版。</desc>
  <g class="floor"><rect x="-15" y="16" width="45" height="1" fill="#A08C6C"/><rect x="-15" y="17" width="45" height="3" fill="#8C7A5E"/></g><g class="lip"><rect x="-8" y="13" width="6" height="3" fill="#6E5F49"/><rect x="-8" y="13" width="6" height="1" fill="#A08C6C"/></g><g class="actor motion"><g fill="#DE886D"><rect id="outer-left-leg" x="3" y="13" width="1" height="2"/><rect id="inner-left-leg" x="5" y="13" width="1" height="2"/><rect id="inner-right-leg" x="9" y="13" width="1" height="2"/><rect id="outer-right-leg" x="11" y="13" width="1" height="2"/><rect id="torso" x="2" y="6" width="11" height="7"/><g class="left-claw motion"><rect id="left-arm" x="0" y="9" width="2" height="2"/></g><g class="right-claw motion"><rect id="right-arm" x="13" y="9" width="2" height="2"/></g></g><g class="eyes motion" fill="#000000"><g class="blink motion"><rect id="left-eye" x="4" y="8" width="1" height="2"/><rect id="right-eye" x="10" y="8" width="1" height="2"/></g></g></g>
</svg>
