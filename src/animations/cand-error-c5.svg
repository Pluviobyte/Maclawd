<?xml-stylesheet type="text/css" href="maclawd-actions.css"?>
<svg xmlns="http://www.w3.org/2000/svg" class="state-error-c5" viewBox="-15 -25 45 45" width="500" height="500" shape-rendering="crispEdges">
  <title>Maclawd Under the Pile</title><desc>塌下来的一堆东西埋掉了整个身子，只剩一条露着眼睛的横带和一只搭在外面的爪。画面主体是那堆东西；角色只是从里面露出来的一小块。</desc>
  <g class="actor motion"><g fill="#DE886D"><rect id="outer-left-leg" x="3" y="13" width="1" height="2"/><rect id="inner-left-leg" x="5" y="13" width="1" height="2"/><rect id="inner-right-leg" x="9" y="13" width="1" height="2"/><rect id="outer-right-leg" x="11" y="13" width="1" height="2"/><rect id="torso" x="2" y="6" width="11" height="7"/><g class="left-claw motion"><rect id="left-arm" x="0" y="9" width="2" height="2"/></g><g class="right-claw motion"><rect id="right-arm" x="13" y="9" width="2" height="2"/></g></g><g class="eyes motion" fill="#000000"><g class="blink motion"><rect id="left-eye" x="4" y="8" width="1" height="2"/><rect id="right-eye" x="10" y="8" width="1" height="2"/></g></g></g><g class="pile motion"><rect x="-13" y="9" width="15" height="12" fill="#B9A1D9"/><rect x="13" y="9" width="16" height="12" fill="#B9A1D9"/><rect x="3" y="13" width="9" height="8" fill="#B9A1D9"/><rect x="-10" y="11" width="5" height="1" fill="#E7DCF2"/><rect x="5" y="16" width="5" height="1" fill="#E7DCF2"/><rect x="15" y="10" width="6" height="1" fill="#E7DCF2"/><rect x="-6" y="15" width="4" height="1" fill="#E7DCF2"/></g><g class="debris motion"><rect x="17" y="2" width="7" height="2" fill="#8B73B3"/><rect x="15" y="4" width="7" height="2" fill="#8B73B3"/><rect x="13" y="6" width="7" height="2" fill="#8B73B3"/><rect x="-13" y="4" width="4" height="5" fill="#8B73B3"/></g><g class="out-claw motion"><rect x="-2" y="8" width="3" height="2" fill="#DE886D"/></g>
</svg>
