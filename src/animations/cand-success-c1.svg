<svg xmlns="http://www.w3.org/2000/svg" class="state-success-c1" viewBox="-15 -25 45 45" width="500" height="500" shape-rendering="crispEdges">
  <title>Maclawd Exhale</title><desc>绷着的身体停一拍，然后一口气泄下去——下沉加纵向压缩，配一次 500ms 的慢眨眼。不跳、不举爪，是「终于完了」不是「我做到了」。</desc>
