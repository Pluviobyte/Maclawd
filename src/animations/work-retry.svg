<?xml-stylesheet type="text/css" href="maclawd-actions.css"?>
<svg xmlns="http://www.w3.org/2000/svg" class="state-working-retrying" viewBox="-15 -25 45 45" width="500" height="500" shape-rendering="crispEdges">
  <title>Maclawd Retry Grip</title><desc>A work tile slips from the claws and drops away; the claws grab for the next one and start over.</desc>
  <g class="actor motion"><g fill="#DE886D"><rect id="outer-left-leg" x="3" y="13" width="1" height="2"/><rect id="inner-left-leg" x="5" y="13" width="1" height="2"/><rect id="inner-right-leg" x="9" y="13" width="1" height="2"/><rect id="outer-right-leg" x="11" y="13" width="1" height="2"/><rect id="torso" x="2" y="6" width="11" height="7"/><g class="left-claw motion"><rect id="left-arm" x="0" y="9" width="2" height="2"/></g><g class="right-claw motion"><rect id="right-arm" x="13" y="9" width="2" height="2"/></g></g><g class="eyes motion" fill="#000000"><g class="blink motion"><rect id="left-eye" x="4" y="8" width="1" height="2"/><rect id="right-eye" x="10" y="8" width="1" height="2"/></g></g></g><g class="tile-ok motion"><rect x="5" y="11" width="5" height="4" fill="#7BC8C4"/><rect x="6" y="12" width="3" height="1" fill="#BDE7E4"/></g><g class="tile-slip motion"><rect x="5" y="11" width="5" height="4" fill="#C4715A"/><rect x="6" y="12" width="3" height="1" fill="#E09A85"/></g>
</svg>
