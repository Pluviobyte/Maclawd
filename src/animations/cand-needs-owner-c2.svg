<?xml-stylesheet type="text/css" href="maclawd-actions.css"?>
<svg xmlns="http://www.w3.org/2000/svg" class="state-needs-owner-c2" viewBox="-15 -25 45 45" width="500" height="500" shape-rendering="crispEdges">
  <title>Maclawd One Shove</title><desc>罐子已经推到你面前的地上，桌宠前倾着、手搭在盖子上、盯着你——**这个姿势保持三分之二个循环**，其间只有呼吸和眼睛在动；然后整身前扑一下，把罐子再往你那边顶一格，罐子晃两下没走远，它退回原来那个姿势继续等。这是六个里唯一为「长时间等待」专门做的：单次事件反而更显眼（余光抓的是突变，不是持续运动），而每 4.8 秒只打扰你一次，总打扰量比基线低一个量级。**几分钟不关掉它的前提就是这个。**静止那段停在「递出去等着」的姿势上（前倾 2 格、手在盖子上），不是中立姿势——你随时瞥一眼都读得到它在等。道具环没换，owner_resolved 原样可用，只是罐子的落点从身侧挪到了右前方，Jar Click 的罐子位置要跟着挪，否则接上去罐子会瞬移。（4800ms 下静默占 3.4s。这条轴本来还想要更长的静默，但那要改契约时长，先按 4800 给保守版。）</desc>
  <g class="jar motion"><g class="lid motion"><rect x="14" y="8" width="10" height="2" fill="#544942"/><rect x="15" y="7" width="8" height="1" fill="#7A6A60"/></g><rect x="15" y="10" width="8" height="8" fill="#BDE7E4"/><rect x="16" y="11" width="1" height="5" fill="#FFF"/><rect x="17" y="14" width="4" height="3" fill="#F4D3E7"/><rect x="18" y="16" width="3" height="1" fill="#C98FBA"/></g><g class="actor motion"><g fill="#DE886D"><rect id="outer-left-leg" x="3" y="13" width="1" height="2"/><rect id="inner-left-leg" x="5" y="13" width="1" height="2"/><rect id="inner-right-leg" x="9" y="13" width="1" height="2"/><rect id="outer-right-leg" x="11" y="13" width="1" height="2"/><rect id="torso" x="2" y="6" width="11" height="7"/><g class="left-claw motion"><rect id="left-arm" x="0" y="9" width="2" height="2"/></g><g class="right-claw motion"><rect id="right-arm" x="13" y="9" width="2" height="2"/></g></g><g class="eyes motion" fill="#000000"><g class="blink motion"><rect id="left-eye" x="4" y="8" width="1" height="2"/><rect id="right-eye" x="10" y="8" width="1" height="2"/></g></g></g>
</svg>
