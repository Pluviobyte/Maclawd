<?xml-stylesheet type="text/css" href="maclawd-actions.css"?>
<svg xmlns="http://www.w3.org/2000/svg" class="state-needs-owner-c4" viewBox="-15 -25 45 45" width="500" height="500" shape-rendering="crispEdges">
  <title>Maclawd Turned Away</title><desc>大半个循环里它是**侧着的**：眼睛都偏到左边、右爪缩进身体后面看不见了、左爪往左伸去够罐子却够不着；然后突然转回正面、站直、盯你一拍，再转回去。罐子留在原位不动——它不是在跟你交涉，它是在跟问题较劲，回头那一下才是冲你来的。余光读到的是**剪影的左右不对称在翻转**（右边那块爪一会儿有一会儿没有），这比单纯的位移更容易被注意到，因为轮廓的拓扑变了。代价是眼睛必须和身体同拍——朝向是靠眼睛偏移读出来的，让眼睛走自己的周期就散了。所以这个候选的活跃度全压在四条腿上（倒腾脚 = 焦躁）。道具环没换，owner_resolved 原样可用。</desc>
  <g class="jar motion"><g class="lid motion"><rect x="-8" y="7" width="8" height="2" fill="#544942"/><rect x="-7" y="6" width="6" height="1" fill="#7A6A60"/></g><path d="M-8 9H0V17H-1V18H-7V17H-8Z" fill="#BDE7E4"/><rect x="-7" y="10" width="1" height="5" fill="#FFF"/><rect x="-6" y="13" width="4" height="3" fill="#F4D3E7"/><rect x="-5" y="15" width="3" height="1" fill="#C98FBA"/></g><g class="actor motion"><g fill="#DE886D"><g class="leg-a motion"><rect id="outer-left-leg" x="3" y="13" width="1" height="2"/></g><g class="leg-b motion"><rect id="inner-left-leg" x="5" y="13" width="1" height="2"/></g><g class="leg-c motion"><rect id="inner-right-leg" x="9" y="13" width="1" height="2"/></g><g class="leg-d motion"><rect id="outer-right-leg" x="11" y="13" width="1" height="2"/></g><rect id="torso" x="2" y="6" width="11" height="7"/><g class="left-claw motion"><rect id="left-arm" x="0" y="9" width="2" height="2"/></g><g class="right-claw motion"><rect id="right-arm" x="13" y="9" width="2" height="2"/></g></g><g class="eyes motion" fill="#000000"><g class="blink motion"><rect id="left-eye" x="4" y="8" width="1" height="2"/><rect id="right-eye" x="10" y="8" width="1" height="2"/></g></g></g>
</svg>
