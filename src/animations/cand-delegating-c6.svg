<?xml-stylesheet type="text/css" href="maclawd-actions.css"?>
<svg xmlns="http://www.w3.org/2000/svg" class="state-delegating-c6" viewBox="-15 -25 45 45" width="500" height="500" shape-rendering="crispEdges">
  <title>Maclawd Tether Lines</title><desc>主角右爪握着一根线轴，三条线从线轴上往右拉出去，每条线的另一头挂着一个远处的小方块——那就是一个子代理。三条线各自以 2900 / 3700 / 4300 的周期一收一放（各自在忙，永不同步），主角被拽着微微后仰、偶尔收一下线，眼睛在三条线之间来回。【一个 vs 多个】线的条数就是数量，主角的关键帧一帧都不用改：一个子代理时只留 .tether-a；≥2 时 .helper-b 出现；.helper-c 是留给 ≥3 的那条——**采用这个候选要给 helper-c 补一条和 helper-b 一样的 display:none 规则**，否则一个子代理时会露出三条线。【表达 N】六个里唯一一个真正按 N 线性扩展的：加一条线 = 加一个子代理，线的长短还能顺带表达「跑了多久」。这正是 working.tiers 想要的形状——delegating 的 one/two 变体只是它的二值前身。【不像埋头干】主角是被三条线拽着的那一端，不是在操作任何东西；它唯一的动作是「拉住」和「看」。</desc>
  <g class="tether-a motion"><rect x="13" y="7" width="11" height="1" fill="#8C7A5E"/><rect x="24" y="5" width="4" height="4" fill="#7BC8C4"/><rect x="24" y="6" width="4" height="1" fill="#BDE7E4"/></g><g class="helper-b motion"><rect x="13" y="10" width="12" height="1" fill="#8C7A5E"/><rect x="25" y="8" width="4" height="4" fill="#B9A1D9"/><rect x="25" y="9" width="4" height="1" fill="#E7DCF2"/></g><g class="helper-c motion"><rect x="13" y="13" width="9" height="1" fill="#8C7A5E"/><rect x="22" y="11" width="4" height="4" fill="#EAB078"/><rect x="22" y="12" width="4" height="1" fill="#F7D9AE"/></g><g class="actor motion"><g fill="#DE886D"><rect id="outer-left-leg" x="3" y="13" width="1" height="2"/><rect id="inner-left-leg" x="5" y="13" width="1" height="2"/><rect id="inner-right-leg" x="9" y="13" width="1" height="2"/><rect id="outer-right-leg" x="11" y="13" width="1" height="2"/><rect id="torso" x="2" y="6" width="11" height="7"/><g class="left-claw motion"><rect id="left-arm" x="0" y="9" width="2" height="2"/></g><g class="right-claw motion"><rect id="right-arm" x="13" y="9" width="2" height="2"/></g></g><g class="eyes motion" fill="#000000"><g class="blink motion"><rect id="left-eye" x="4" y="8" width="1" height="2"/><rect id="right-eye" x="10" y="8" width="1" height="2"/></g></g></g><g class="reins motion"><rect x="15" y="7" width="1" height="7" fill="#6F5F49"/></g>
</svg>
