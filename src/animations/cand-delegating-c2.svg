<?xml-stylesheet type="text/css" href="maclawd-actions.css"?>
<svg xmlns="http://www.w3.org/2000/svg" class="state-delegating-c2" viewBox="-15 -25 45 45" width="500" height="500" shape-rendering="crispEdges">
  <title>Maclawd Long Toss</title><desc>后仰蓄力，把包裹抛出一条弧线，最高点停最久——那一拍主角已经空着手，包裹还在天上，接手在下面抬爪等着。包裹落到它头顶那一瞬间被砸得一沉（落怀里会正好盖住它的脸），顶着走两步，主角同时弯腰摸下一个。「递过去」两只手一直连在一起，「抛过去」中间有一段谁都没拿着——那段滞空就是「已经不归我管了」。【一个 vs 多个】一个子代理时只有近处那个接手；两个及以上时 .helper-b（更高更小、抱着上一件正在走远的那个）出现，周期 4200 与主循环错开，于是画面上永远有一件在飞、一件在被搬走。【表达 N】靠远处那条走廊上的助手数，可以再排第三个更小更高的，但三个之后深度线索就用完了。【不像埋头干】抛完之后有明确的「空手」段，那是 working 里不会出现的。</desc>
  <g class="helper-a motion"><rect x="18" y="9" width="6" height="4" fill="#F1A186"/><rect x="16" y="10" width="2" height="2" fill="#F1A186"/><rect x="24" y="10" width="2" height="2" fill="#F1A186"/><rect x="19" y="13" width="1" height="2" fill="#F1A186"/><rect x="22" y="13" width="1" height="2" fill="#F1A186"/><rect x="19" y="10" width="1" height="2" fill="#000000"/><rect x="22" y="10" width="1" height="2" fill="#000000"/></g><g class="helper-b motion"><rect x="24" y="5" width="5" height="3" fill="#EAB078"/><rect x="25" y="8" width="1" height="2" fill="#EAB078"/><rect x="27" y="8" width="1" height="2" fill="#EAB078"/><rect x="25" y="6" width="1" height="1" fill="#000000"/><rect x="27" y="6" width="1" height="1" fill="#000000"/><rect x="21" y="3" width="3" height="3" fill="#B9A1D9"/><rect x="21" y="4" width="3" height="1" fill="#E7DCF2"/></g><g class="actor motion"><g fill="#DE886D"><rect id="outer-left-leg" x="3" y="13" width="1" height="2"/><rect id="inner-left-leg" x="5" y="13" width="1" height="2"/><rect id="inner-right-leg" x="9" y="13" width="1" height="2"/><rect id="outer-right-leg" x="11" y="13" width="1" height="2"/><rect id="torso" x="2" y="6" width="11" height="7"/><g class="left-claw motion"><rect id="left-arm" x="0" y="9" width="2" height="2"/></g><g class="right-claw motion"><rect id="right-arm" x="13" y="9" width="2" height="2"/></g></g><g class="eyes motion" fill="#000000"><g class="blink motion"><rect id="left-eye" x="4" y="8" width="1" height="2"/><rect id="right-eye" x="10" y="8" width="1" height="2"/></g></g></g><g class="parcel motion"><rect x="13" y="9" width="4" height="4" fill="#F6C85F"/><rect x="13" y="10" width="4" height="1" fill="#B67B19"/></g>
</svg>
