<?xml-stylesheet type="text/css" href="maclawd-actions.css"?>
<svg xmlns="http://www.w3.org/2000/svg" class="state-work-r" viewBox="-15 -25 45 45" width="500" height="500" shape-rendering="crispEdges">
  <title>Maclawd Pedal</title><desc>Four legs work a treadle in turn; the board rocks under them and the whole body rides it.</desc>
  <g class="board motion"><rect x="0" y="15" width="15" height="2" fill="#8C7A5E"/><rect x="0" y="17" width="15" height="1" fill="#6E5F49"/><rect x="2" y="16" width="3" height="1" fill="#A08C6C"/><rect x="10" y="16" width="3" height="1" fill="#A08C6C"/></g><g class="actor motion"><g fill="#DE886D"><g class="leg-a motion"><rect id="outer-left-leg" x="3" y="13" width="1" height="2"/></g><g class="leg-b motion"><rect id="inner-left-leg" x="5" y="13" width="1" height="2"/></g><g class="leg-c motion"><rect id="inner-right-leg" x="9" y="13" width="1" height="2"/></g><g class="leg-d motion"><rect id="outer-right-leg" x="11" y="13" width="1" height="2"/></g><rect id="torso" x="2" y="6" width="11" height="7"/><g class="left-claw motion"><rect id="left-arm" x="0" y="9" width="2" height="2"/></g><g class="right-claw motion"><rect id="right-arm" x="13" y="9" width="2" height="2"/></g></g><g class="eyes motion" fill="#000000"><g class="blink motion"><rect id="left-eye" x="4" y="8" width="1" height="2"/><rect id="right-eye" x="10" y="8" width="1" height="2"/></g></g></g>
</svg>
