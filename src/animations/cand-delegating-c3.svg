<?xml-stylesheet type="text/css" href="maclawd-actions.css"?>
<svg xmlns="http://www.w3.org/2000/svg" class="state-delegating-c3" viewBox="-15 -25 45 45" width="500" height="500" shape-rendering="crispEdges">
  <title>Maclawd Dispatch Desk</title><desc>主角站到画面左侧的台子上，右爪抬起指向右边，**指住那一拍是全循环最长的**；被指的助手扛着包裹往右走、出画、下一个补上。主角自己手上什么都没有，全程只有指、看、换重心三件事。六个里唯一一个「主角不在画面中央、也不接触任何道具」的构图——「我只负责分配」这句话靠位置和空手说，不靠动作。【一个 vs 多个】一个子代理时只有下面那条道；两个及以上时 .helper-b（更高那条道上更小的那个）出现，周期 3900 与主循环互质，两条道永远错开，读作「两边各跑各的」。【表达 N】天然按「道」扩：每多一个子代理加一条更高更小的道，主角的动作一个字都不用改——这一点最接近 working.tiers 想要的东西。【注意】主角的偏移是靠每一帧的 translate(-7px,-3px) 做的，prefers-reduced-motion 下动画被整体关掉，主角会掉回画面中央、站在台子旁边。要采用它得给这个动作单独写一条静止姿势。</desc>
  <rect x="-7" y="12" width="14" height="3" fill="#8C7A5E"/><rect x="-7" y="12" width="14" height="1" fill="#A99070"/><g class="helper-a motion"><rect x="14" y="9" width="6" height="4" fill="#F1A186"/><rect x="12" y="10" width="2" height="2" fill="#F1A186"/><rect x="20" y="10" width="2" height="2" fill="#F1A186"/><rect x="15" y="13" width="1" height="2" fill="#F1A186"/><rect x="18" y="13" width="1" height="2" fill="#F1A186"/><rect x="15" y="10" width="1" height="2" fill="#000000"/><rect x="18" y="10" width="1" height="2" fill="#000000"/><rect x="16" y="6" width="3" height="3" fill="#F6C85F"/><rect x="16" y="7" width="3" height="1" fill="#FFE59A"/></g><g class="helper-b motion"><rect x="22" y="5" width="5" height="3" fill="#EAB078"/><rect x="23" y="8" width="1" height="2" fill="#EAB078"/><rect x="25" y="8" width="1" height="2" fill="#EAB078"/><rect x="23" y="6" width="1" height="1" fill="#000000"/><rect x="25" y="6" width="1" height="1" fill="#000000"/><rect x="23" y="2" width="3" height="3" fill="#7BC8C4"/><rect x="23" y="3" width="3" height="1" fill="#BDE7E4"/></g><g class="actor motion"><g fill="#DE886D"><rect id="outer-left-leg" x="3" y="13" width="1" height="2"/><rect id="inner-left-leg" x="5" y="13" width="1" height="2"/><rect id="inner-right-leg" x="9" y="13" width="1" height="2"/><rect id="outer-right-leg" x="11" y="13" width="1" height="2"/><rect id="torso" x="2" y="6" width="11" height="7"/><g class="left-claw motion"><rect id="left-arm" x="0" y="9" width="2" height="2"/></g><g class="right-claw motion"><rect id="right-arm" x="13" y="9" width="2" height="2"/></g></g><g class="eyes motion" fill="#000000"><g class="blink motion"><rect id="left-eye" x="4" y="8" width="1" height="2"/><rect id="right-eye" x="10" y="8" width="1" height="2"/></g></g></g>
</svg>
