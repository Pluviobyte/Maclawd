<?xml-stylesheet type="text/css" href="maclawd-actions.css"?>
<svg xmlns="http://www.w3.org/2000/svg" class="state-delegating-c4" viewBox="-15 -25 45 45" width="500" height="500" shape-rendering="crispEdges">
  <title>Maclawd Handoff Ghost</title><desc>画面上只有主角和包裹。主角把包裹举到身侧递出去、举着等一拍，然后包裹**加速**往右抽走（一拍 6 格、下一拍 9 格）、出画淡掉；主角被带得往回一缩，目送，再从脚边捡起下一个。助手一个都不画，靠三件事说清「被人接走了」：抽走的加速度、主角的反冲、以及那只还张着的空爪。好处是构图最干净——135px 下其余五个都要挤两三个小家伙，这个不用。【一个 vs 多个】数量落在**包裹**上而不是助手上：一个子代理时只有那个黄包裹；两个及以上时 .helper-b（脚边那个青色包裹）出现，周期 3400，自己走自己的节奏被抽走，于是画面上两件东西在被并行取走。【表达 N】可以按包裹数扩到三四件，但它们都从同一个人手里出去，读作「东西多」比读作「人多」自然。【不像埋头干】主角的动作只有举起和松手，没有任何反复操作。</desc>
  <g class="actor motion"><g fill="#DE886D"><rect id="outer-left-leg" x="3" y="13" width="1" height="2"/><rect id="inner-left-leg" x="5" y="13" width="1" height="2"/><rect id="inner-right-leg" x="9" y="13" width="1" height="2"/><rect id="outer-right-leg" x="11" y="13" width="1" height="2"/><rect id="torso" x="2" y="6" width="11" height="7"/><g class="left-claw motion"><rect id="left-arm" x="0" y="9" width="2" height="2"/></g><g class="right-claw motion"><rect id="right-arm" x="13" y="9" width="2" height="2"/></g></g><g class="eyes motion" fill="#000000"><g class="blink motion"><rect id="left-eye" x="4" y="8" width="1" height="2"/><rect id="right-eye" x="10" y="8" width="1" height="2"/></g></g></g><g class="parcel motion"><rect x="12" y="12" width="4" height="3" fill="#F6C85F"/><rect x="12" y="13" width="4" height="1" fill="#B67B19"/></g><g class="helper-b motion"><rect x="2" y="12" width="4" height="3" fill="#7BC8C4"/><rect x="2" y="13" width="4" height="1" fill="#BDE7E4"/></g>
</svg>
