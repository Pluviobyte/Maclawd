<?xml-stylesheet type="text/css" href="maclawd-actions.css"?>
<svg xmlns="http://www.w3.org/2000/svg" class="state-needs-owner-c6" viewBox="-15 -25 45 45" width="500" height="500" shape-rendering="crispEdges">
  <title>Maclawd Locked Stare</title><desc>它不跟罐子较劲了。罐子搁在身侧一动不动，桌宠正对着你站定，**眼睛整整一个循环停在同一个位置**（一条只有一个姿态的图层），身体只有极缓慢的一次重心来回，四千八百毫秒里慢慢眨一次眼，闭 0.6 秒。这是六个里最不烦人的一个，可以挂几分钟不让人想关掉。但要说实话：**这条轴解决不了余光问题。**余光看不见 3px 的眼睛，它能提供的只是「你已经转过头之后」的存在感——一只不眨眼盯着你的东西比一只在忙的东西更难移开视线。它真正的余光信号是**由动到不动的反差**（从 working / thinking 切进来时，动的东西突然停了，那一下是个突变），但那依赖前一个状态，单看循环读不出来。所以它更适合当 c2 的第二段：先安静盯着，等久了再开始推。道具环没换，owner_resolved 原样可用。风险登记：完全不游移的眼睛容易被读成「动画卡住了」，所以保留了那一次慢眨眼——去掉它更冷，但也更像程序挂了。</desc>
  <g class="jar motion"><g class="lid motion"><rect x="-8" y="7" width="8" height="2" fill="#544942"/><rect x="-7" y="6" width="6" height="1" fill="#7A6A60"/></g><path d="M-8 9H0V17H-1V18H-7V17H-8Z" fill="#BDE7E4"/><rect x="-7" y="10" width="1" height="5" fill="#FFF"/><rect x="-6" y="13" width="4" height="3" fill="#F4D3E7"/><rect x="-5" y="15" width="3" height="1" fill="#C98FBA"/></g><g class="actor motion"><g fill="#DE886D"><rect id="outer-left-leg" x="3" y="13" width="1" height="2"/><rect id="inner-left-leg" x="5" y="13" width="1" height="2"/><rect id="inner-right-leg" x="9" y="13" width="1" height="2"/><rect id="outer-right-leg" x="11" y="13" width="1" height="2"/><rect id="torso" x="2" y="6" width="11" height="7"/><g class="left-claw motion"><rect id="left-arm" x="0" y="9" width="2" height="2"/></g><g class="right-claw motion"><rect id="right-arm" x="13" y="9" width="2" height="2"/></g></g><g class="eyes motion" fill="#000000"><g class="blink motion"><rect id="left-eye" x="4" y="8" width="1" height="2"/><rect id="right-eye" x="10" y="8" width="1" height="2"/></g></g></g>
</svg>
