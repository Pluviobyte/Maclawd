<svg xmlns="http://www.w3.org/2000/svg" class="state-work-i" viewBox="-15 -25 45 45" width="500" height="500" shape-rendering="crispEdges">
  <title>Maclawd Desk Hunch</title><desc>Turned away from you, hunched over the work; only the back and a bit of claw show.</desc>
  <g class="desk"><rect x="0" y="10" width="15" height="1" fill="#8C7A5E"/><rect x="1" y="11" width="13" height="1" fill="#6E5F49"/></g><g class="actor motion"><g fill="#DE886D"><rect id="outer-left-leg" x="3" y="13" width="1" height="2"/><rect id="inner-left-leg" x="5" y="13" width="1" height="2"/><rect id="inner-right-leg" x="9" y="13" width="1" height="2"/><rect id="outer-right-leg" x="11" y="13" width="1" height="2"/><rect id="torso" x="2" y="6" width="11" height="7"/><g class="left-claw motion"><rect id="left-arm" x="0" y="9" width="2" height="2"/></g><g class="right-claw motion"><rect id="right-arm" x="13" y="9" width="2" height="2"/></g></g><g class="eyes motion" fill="#000000"><g class="blink motion"><rect id="left-eye" x="4" y="8" width="1" height="2"/><rect id="right-eye" x="10" y="8" width="1" height="2"/></g></g></g><g class="shell"><rect x="3" y="8" width="9" height="1" fill="#C4715A"/><rect x="4" y="10" width="7" height="1" fill="#C4715A"/></g>
</svg>
