<svg xmlns="http://www.w3.org/2000/svg" class="state-work-g" viewBox="-15 -25 45 45" width="500" height="500" shape-rendering="crispEdges">
  <title>Maclawd Head Carry</title><desc>A stack rides on top of the head; the whole body works to keep it balanced while the legs take small steps.</desc>
  <g class="actor motion"><g fill="#DE886D"><g class="leg-a motion"><rect id="outer-left-leg" x="3" y="13" width="1" height="2"/></g><g class="leg-b motion"><rect id="inner-left-leg" x="5" y="13" width="1" height="2"/></g><g class="leg-c motion"><rect id="inner-right-leg" x="9" y="13" width="1" height="2"/></g><g class="leg-d motion"><rect id="outer-right-leg" x="11" y="13" width="1" height="2"/></g><rect id="torso" x="2" y="6" width="11" height="7"/><g class="left-claw motion"><rect id="left-arm" x="0" y="9" width="2" height="2"/></g><g class="right-claw motion"><rect id="right-arm" x="13" y="9" width="2" height="2"/></g></g><g class="eyes motion" fill="#000000"><g class="blink motion"><rect id="left-eye" x="4" y="8" width="1" height="2"/><rect id="right-eye" x="10" y="8" width="1" height="2"/></g></g></g><g class="load motion"><rect x="3" y="3" width="9" height="3" fill="#7BC8C4"/><rect x="4" y="4" width="3" height="1" fill="#BDE7E4"/><rect x="4" y="0" width="7" height="3" fill="#F6C85F"/><rect x="5" y="1" width="3" height="1" fill="#FFE3A3"/><rect x="5" y="-3" width="5" height="3" fill="#B9A1D9"/><rect x="6" y="-2" width="2" height="1" fill="#E7DCF2"/></g>
</svg>
