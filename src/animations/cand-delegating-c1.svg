<?xml-stylesheet type="text/css" href="maclawd-actions.css"?>
<svg xmlns="http://www.w3.org/2000/svg" class="state-delegating-c1" viewBox="-15 -25 45 45" width="500" height="500" shape-rendering="crispEdges">
  <title>Maclawd Shadow Split</title><desc>主角下蹲蓄力、弹起，一个和自己同形的深色分身从身体里脱出来，往侧面滑走、到边缘淡掉；主角站直目送，眼睛跟着它走。子代理就是「另一个我」——这个候选把那句话直接画出来，不需要观众建立「小家伙 = 子代理」的额外联想。【一个 vs 多个】一个子代理时只有右边那个分身；两个及以上时 .helper-b（左边的分身）同时出现，左右对称地各走一个方向，读作「一分为二」。【表达 N】不好扩：三个以上分身会把主角围住，读成「被自己包围」而不是「派了三个」。它换的是形态，不是数量。【不像埋头干】主角全程没有操作任何东西，只有一次蓄力和一次目送。</desc>
  <g class="clone-a motion" fill="#C4715A"><rect x="3" y="8" width="8" height="5"/><rect x="4" y="13" width="1" height="2"/><rect x="9" y="13" width="1" height="2"/><rect x="5" y="10" width="1" height="2" fill="#000000"/><rect x="8" y="10" width="1" height="2" fill="#000000"/></g><g class="helper-b motion" fill="#B9705C"><rect x="3" y="8" width="8" height="5"/><rect x="4" y="13" width="1" height="2"/><rect x="9" y="13" width="1" height="2"/><rect x="5" y="10" width="1" height="2" fill="#000000"/><rect x="8" y="10" width="1" height="2" fill="#000000"/></g><g class="actor motion"><g fill="#DE886D"><rect id="outer-left-leg" x="3" y="13" width="1" height="2"/><rect id="inner-left-leg" x="5" y="13" width="1" height="2"/><rect id="inner-right-leg" x="9" y="13" width="1" height="2"/><rect id="outer-right-leg" x="11" y="13" width="1" height="2"/><rect id="torso" x="2" y="6" width="11" height="7"/><g class="left-claw motion"><rect id="left-arm" x="0" y="9" width="2" height="2"/></g><g class="right-claw motion"><rect id="right-arm" x="13" y="9" width="2" height="2"/></g></g><g class="eyes motion" fill="#000000"><g class="blink motion"><rect id="left-eye" x="4" y="8" width="1" height="2"/><rect id="right-eye" x="10" y="8" width="1" height="2"/></g></g></g>
</svg>
