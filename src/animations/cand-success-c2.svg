<svg xmlns="http://www.w3.org/2000/svg" class="state-success-c2" viewBox="-15 -25 45 45" width="500" height="500" shape-rendering="crispEdges">
  <title>Maclawd Set It Down</title><desc>把端着的方块降到身侧地上，松爪，空着爪直起身。庆祝的证据是那个交付物，不是姿势。</desc>
