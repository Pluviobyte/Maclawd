<?xml-stylesheet type="text/css" href="maclawd-actions.css"?>
<svg xmlns="http://www.w3.org/2000/svg" class="state-needs-owner-c3" viewBox="-15 -25 45 45" width="500" height="500" shape-rendering="crispEdges">
  <title>Maclawd Empty Claws</title><desc>没有任何道具。桌宠反复把身体拔高、双爪举到头顶两侧摊开，再整个缩回去；举起来的时候身高从 7.7 个单位涨到 10 个，**剪影每两秒吞吐一次**。拿掉道具反而让语义更准：它手里什么都没有，它自己解决不了——这正是 needs_owner 的意思。基线的罐子把「卡住」演成了一件具体的事，而 Claude 卡住通常没有对应的实物。和 success（Self High-five）的区别是双爪**分开摊着**不是碰到一起，而且是循环不是一次性起跳。**收尾必须另配：**它不开道具环，所以 owner_resolved 也得是纯姿态的——双爪落回身侧、身体一口气松下来（scaleY 从 1.1 落回 1.0）、一次快眨眼。现有的 Jar Click 在这个候选下用不上，硬接会凭空冒出一个罐子。</desc>
  <g class="actor motion"><g fill="#DE886D"><rect id="outer-left-leg" x="3" y="13" width="1" height="2"/><rect id="inner-left-leg" x="5" y="13" width="1" height="2"/><rect id="inner-right-leg" x="9" y="13" width="1" height="2"/><rect id="outer-right-leg" x="11" y="13" width="1" height="2"/><rect id="torso" x="2" y="6" width="11" height="7"/><g class="left-claw motion"><rect id="left-arm" x="0" y="9" width="2" height="2"/></g><g class="right-claw motion"><rect id="right-arm" x="13" y="9" width="2" height="2"/></g></g><g class="eyes motion" fill="#000000"><g class="blink motion"><rect id="left-eye" x="4" y="8" width="1" height="2"/><rect id="right-eye" x="10" y="8" width="1" height="2"/></g></g></g>
</svg>
