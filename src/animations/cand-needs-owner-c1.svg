<?xml-stylesheet type="text/css" href="maclawd-actions.css"?>
<svg xmlns="http://www.w3.org/2000/svg" class="state-needs-owner-c1" viewBox="-15 -25 45 45" width="500" height="500" shape-rendering="crispEdges">
  <title>Maclawd Held High</title><desc>双爪把罐子整个举过头顶，撑住不放；撑久了手发抖、腿打颤、重心左右晃，然后深吸一口气再顶高一格。基线是把东西推开，这个是把东西**举着不放**——推完就没事了，举着是持续的请求。余光里读到的是**剪影长高了一大截**（头顶多出 13 个单位的方块），而且这个变化在它不动的时候也一直在。道具环没换：罐子还在，owner_resolved（Jar Click）可以原样接上，接的是「你把它接过去、盖子咔哒松开」。注意「举累了往下沉」在这里做不了：爪子一落到躯干轮廓里就整块消失（同色），罐底再往下就压到眼睛。所以「撑不住」只能靠发抖和**身体往下坠而手还钉在原处**表达——这是几何逼出来的，不是选择，但坠出来的那两格间隙反而比下沉更像脱力。</desc>
  <g class="jar motion"><g class="lid motion"><rect x="3" y="-7" width="10" height="2" fill="#544942"/><rect x="4" y="-8" width="8" height="1" fill="#7A6A60"/></g><rect x="4" y="-5" width="8" height="10" fill="#BDE7E4"/><rect x="5" y="-4" width="1" height="7" fill="#FFF"/><rect x="6" y="0" width="4" height="4" fill="#F4D3E7"/><rect x="7" y="3" width="3" height="1" fill="#C98FBA"/></g><g class="actor motion"><g fill="#DE886D"><g class="leg-a motion"><rect id="outer-left-leg" x="3" y="13" width="1" height="2"/></g><g class="leg-b motion"><rect id="inner-left-leg" x="5" y="13" width="1" height="2"/></g><g class="leg-c motion"><rect id="inner-right-leg" x="9" y="13" width="1" height="2"/></g><g class="leg-d motion"><rect id="outer-right-leg" x="11" y="13" width="1" height="2"/></g><rect id="torso" x="2" y="6" width="11" height="7"/><g class="left-claw motion"><rect id="left-arm" x="0" y="9" width="2" height="2"/></g><g class="right-claw motion"><rect id="right-arm" x="13" y="9" width="2" height="2"/></g></g><g class="eyes motion" fill="#000000"><g class="blink motion"><rect id="left-eye" x="4" y="8" width="1" height="2"/><rect id="right-eye" x="10" y="8" width="1" height="2"/></g></g></g>
</svg>
