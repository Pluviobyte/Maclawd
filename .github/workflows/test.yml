name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # macOS 是目标平台；Ubuntu 用来暴露路径与大小写假设。
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # 零依赖，没有 npm install 这一步
      - run: node --version
      - run: npm test

  macos-shell:
    # 外壳必须能编译；只在 macOS runner 上做。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build -c release
        working-directory: mac
