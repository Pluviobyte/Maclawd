<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Maclawd — Complete Motion Lab</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; background:#f4f1ea; color:#1e1e2e; }
      * { box-sizing:border-box; }
      body { min-height:100vh; margin:0; padding:48px 24px 72px; }
      main { width:min(1440px, 100%); margin:0 auto; }
      header { max-width:820px; margin-bottom:42px; }
      .eyebrow { margin:0 0 10px; color:#c67a62; font-size:13px; font-weight:780; letter-spacing:.12em; text-transform:uppercase; }
      h1 { margin:0; font-size:clamp(44px,7vw,82px); line-height:.94; letter-spacing:-.04em; }
      header p, .copy p, .section-head p { color:#50505e; line-height:1.58; }
      .section { margin-top:48px; }
      .section-head { display:flex; align-items:end; justify-content:space-between; gap:20px; margin:0 0 18px; }
      .section-head h2 { margin:0; font-size:30px; }
      .section-head p { max-width:580px; margin:0; }
      .motion-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:18px; }
      .motion-card { overflow:hidden; border:1px solid rgba(30,30,46,.11); border-radius:26px; background:#fbfaf7; box-shadow:0 16px 46px rgba(30,30,46,.075); }
      .stage { aspect-ratio:1; background:linear-gradient(rgba(30,30,46,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(30,30,46,.035) 1px,transparent 1px),#fbfaf7; background-size:24px 24px; }
      object { width:100%; height:100%; image-rendering:pixelated; }
      /* mini 舞台右侧那条实线代表屏幕边缘——角色的右半边正是被它裁掉的。 */
      .edge-stage { position:relative; }
      .edge-stage::after { content:""; position:absolute; inset:0 0 0 auto; width:3px; background:#c67a62; }
      .copy { padding:0 19px 21px; }
      .copy h3 { margin:2px 0 7px; font-size:20px; }
      .copy p { min-height:50px; margin:0; font-size:14px; }
      .state-id { color:#c67a62; font:12px ui-monospace,SFMono-Regular,Menlo,monospace; }
      .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:15px; }
      .chip { padding:6px 9px; border-radius:999px; background:#fff; border:1px solid rgba(30,30,46,.1); font-size:11px; font-weight:680; }
      .note { margin-top:32px; padding:18px 20px; border:1px solid rgba(30,30,46,.1); border-radius:18px; color:#626271; background:rgba(255,255,255,.45); font-size:14px; }
      .note a { color:#a55f4c; }
      @media(max-width:1080px){.motion-grid{grid-template-columns:repeat(3,minmax(0,1fr));}}
      @media(max-width:760px){.motion-grid{grid-template-columns:repeat(2,minmax(0,1fr));}.section-head{display:block}.section-head p{margin-top:8px}}
      @media(max-width:520px){body{padding:30px 14px 48px}.motion-grid{grid-template-columns:1fr}.copy p{min-height:0}}
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Maclawd · Complete motion lab</p>
        <h1>状态会变化，<br>角色还是它。</h1>
        <p>身体、眼睛、颜色与坐标保持不变；动作以身体表演为主，道具只贴身出现或纵向叠放，不再为每个状态铺一块横向舞台。这里汇总 39 个动作：31 个主形态（主状态、工作修饰、运行时生命周期、互动与环境反应）与 8 个贴边收起的 mini。渲染尺寸取 45 单位取景的整数倍（主形态 135px、mini 48px），非整数倍会让 1 单位宽的矩形忽宽忽窄，角色轮廓每移动一格就抖一次。</p>
      </header>
      <div id="lab"></div>
      <p class="note">旧的机械候选仍保留在 <a href="design/concepts/all-primary-states.html">静态概念档案</a>；当前页面展示的是新的趣味动作方向。</p>
    </main>
    <script>
      const groups = [
        {
          title: "11 个主状态",
          copy: "用于表达 owner 与 Agent 的稳定主状态；休眠链、任务链和结果链都有明确转场。",
          items: [
            ["idle","Quiet Watch","calm-calibration.svg","5.6s loop","不带道具，安静呼吸、观察和眨眼"],
            ["away","Blanket Tug","blanket-drag.svg","3.8s transition","困倦地把小毛毯拉到身边"],
            ["sleeping","Top-down Sleep","blanket-burrito.svg","6.4s loop","俯视平躺在枕头上，盖被呼吸并冒出像素 Zzz"],
            ["waking","Morning Stretch","blanket-pop.svg","2.6s transition","起身伸展，小毛毯从身前滑落"],
            ["thinking","Puzzle Turn","shell-shuffle.svg","4.6s loop","双爪间转动最后一块拼图"],
            ["working","Tile Stack","token-knitting.svg","3.4s loop","在身前交替整理两块重叠工作牌"],
            ["delegating","Parcel Stack","hatchling-parade.svg","5.0s loop","把包裹递给身侧纵向接力的助手"],
            ["needs_owner","Stuck Jar","stuck-jar.svg","4.8s loop","拧不开罐子后把它推给主人"],
            ["compacting","Suitcase Fold","accordion-fold.svg","4.8s loop","把大条纹布逐折塞进行李箱"],
            ["success","Self High-five","self-high-five.svg","2.9s reaction","直接起跳，双爪在头顶碰到"],
            ["error","Basket Rescue","yarn-tangle.svg","4.8s loop","被大篮子扣住，挣脱后又被碰倒"]
          ]
        },
        {
          title: "2 个 working 活动修饰",
          copy: "只保留跑得够久、看得见的两个。Read/Edit 几毫秒就返回，修饰一闪而过，真机试跑时实测看不见——判据是能不能被看见，不是好不好看。其余统一回退到 Tile Stack。",
          items: [
            ["working.building","Block Stack","block-tower.svg","5.0s loop","在身侧纵向叠好两块积木"],
            ["working.testing","Toy Check","wobble-test.svg","4.8s loop","轻推身侧不倒翁并观察回正"],
          ]
        },
        {
          title: "6 个互动与环境彩蛋",
          copy: "这些动作由桌面交互或环境事件触发，不冒充 Agent 的具体任务进度。",
          items: [
            ["interaction.click","Poke Squish","click-flinch.svg","2.2s reaction","被轻点后身体侧向压扁并回望"],
            ["interaction.double_click","Surprised Hop","surprised-hop.svg","2.4s reaction","连点后直接惊跳一次"],
            ["interaction.drag","Hanging Loop","drag-cling.svg","3.2s held loop","被拖动时双爪抓住中央吊环"],
            ["interaction.drop","Drop Wobble","drop-wobble.svg","2.6s reaction","落地后压扁、回弹、站稳"],
            ["ambient.edge","Curtain Peek","edge-peek.svg","4.6s loop","从大帘幕后偷看再躲回去"],
            ["ambient.low_battery","Low Battery Droop","low-battery-droop.svg","6.2s loop","身体下沉、双爪内卷并半闭眼"]
          ]
        },
        {
          title: "6 个运行时补全动作",
          copy: "补齐启动、退出、移动、等待和状态收尾；只响应可靠事件，不根据不可见推理猜任务。",
          items: [
            ["launching","Hello Unfold","hello-unfold.svg","2.8s transition","从压扁小团展开，双爪打开后站稳"],
            ["quitting","Goodbye Tuck","goodbye-tuck.svg","2.8s transition","挥一次小爪，闭眼并把身体收回小团"],
            ["waiting","Claw Tap Wait","claw-tap-wait.svg","4.2s loop","身体保持原位，一只爪连续轻点三次"],
            ["paused","Statue Pause","statue-pause.svg","6.0s loop","双爪内收，几乎静止，只留下慢呼吸和眨眼"],
            ["owner_resolved","Jar Click","jar-click.svg","3.2s transition","罐盖咔哒松开，扶稳罐子并放心眨眼"],
            ["recovering","Basket Breakout","basket-breakout.svg","3.4s transition","把篮子从身上推开，抖一抖重新站稳"]
          ]
        },
        {
          title: "5 个生命感与环境动作",
          copy: "低频 idle 彩蛋和 Mac 自己能观察到的环境事件；不绘制光标、通知图标或网络图标。",
          items: [
            ["idle.grooming","Claw Groom","idle-claw-groom.svg","5.2s idle variant","低头用一只爪仔细擦另一只爪"],
            ["idle.leg_shuffle","Leg Shuffle","idle-leg-shuffle.svg","4.8s idle variant","四条小腿依次挪动，重新找舒服站姿"],
            ["idle.drowsy","Drowsy Nod","idle-drowsy-nod.svg","6.0s idle variant","慢慢打瞌睡，忽然点醒再恢复站姿"],
            ["interaction.hover","Cursor Gaze","hover-gaze.svg","3.0s held loop","不画光标，只用眼神、重心和一只爪跟随"],
            ["ambient.offline","Signal Listen","signal-listen.svg","5.2s loop","没有信号图标，停下来向左右仔细听"],
          ]
        },
        {
          title: "8 个 mini（贴边）动作",
          copy: "拖到屏幕边缘后收起成 48px。mini 不是把角色缩小，而是把镜头推近、裁掉场景只留演员——主形态 128px÷45 单位≈2.84px/单位，mini 48px÷16 单位=3px/单位，角色在屏幕上几乎一样大。贴边位右半边被裁掉，所以静止时只露出一只眼睛，探出来才看得到两只。这一档不带任何道具。",
          mini: true,
          items: [
            ["mini.idle","Edge Doze","mini-idle.svg","5.2s loop","贴边安静待命，只露一只半闭的眼睛"],
            ["mini.busy","Edge Bob","mini-busy.svg","3.2s loop","带工作节奏地起伏，爪子在动"],
            ["mini.peek","Edge Peek","mini-peek.svg","3.6s loop","向左探出直到两只眼睛都进画面，再缩回"],
            ["mini.alert","Edge Tap","mini-alert.svg","2.4s loop","探出一点并连敲两下边框，要人决定"],
            ["mini.error","Edge Slump","mini-error.svg","4.4s loop","歪靠着边框缓慢摇晃，眼睛半闭"],
            ["mini.happy","Edge Bounce","mini-happy.svg","2.4s oneshot","从边上弹出一次再落回"],
            ["mini.enter","Tuck In","mini-enter.svg","1.6s transition","从主形态中心滑进贴边位"],
            ["mini.exit","Pop Out","mini-exit.svg","1.6s transition","从贴边位滑出，准备回到主形态"]
          ]
        }
      ];
      const lab = document.querySelector("#lab");
      for (const group of groups) {
        const section = document.createElement("section"); section.className = "section";
        section.innerHTML = `<div class="section-head"><h2>${group.title}</h2><p>${group.copy}</p></div><div class="motion-grid"></div>`;
        const grid = section.querySelector(".motion-grid");
        for (const [id,name,file,timing,story] of group.items) {
          const article = document.createElement("article"); article.className = "motion-card";
          // mini 的舞台画一条屏幕边界线：不标出「边在哪」，
          // 「被裁掉半个身子」会看起来像素材画坏了。
          const stage = group.mini ? "stage edge-stage" : "stage";
          const size = group.mini ? "48px checked" : "135px checked";
          article.innerHTML = `<div class="${stage}"><object data="src/animations/${file}" type="image/svg+xml">${name}</object></div><div class="copy"><span class="state-id">${id}</span><h3>${name}</h3><p>${story}</p><div class="chips"><span class="chip">${timing}</span><span class="chip">${size}</span></div></div>`;
          grid.append(article);
        }
        lab.append(section);
      }
    </script>
  </body>
</html>
